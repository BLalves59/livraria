<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Livraria</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Livraria</h1>
        <p>Gerenciamento de livros</p>
    </header>

    <main>

    <section class="acoes">
        <button id="btn-cadastrar">+ Cadastrar livro</button>
    </section>

    <section class="livros">
        <h2>Livros disponíveis</h2>

        <div id="lista-livros" class="lista-livros">
            <p>Carregando livros...</p>
        </div>
    </section>


    <!-- sessão cadastro -->
    <section id="formulario-container" class="formulario-container oculto">

    <h2>Cadastrar livro</h2>

    <form id="formulario-livro">

        <label for="titulo">Título</label>
        <input type="text" id="titulo" required>

        <label for="autor">Autor</label>
        <input type="text" id="autor" required>

        <label for="categoria">Categoria</label>
        <input type="text" id="categoria" required>

        <label for="preco">Preço</label>
        <input type="number" id="preco" step="0.01" min="0" required>

        <label for="estoque">Estoque</label>
        <input type="number" id="estoque" min="0" required>

        <label for="capa">Nome da capa</label>
        <input type="text" id="capa" placeholder="exemplo.jpg">

        <div class="botoes-formulario">
            <button type="submit" id="btn-salvar">Salvar</button>
            <button type="button" id="btn-cancelar">Cancelar</button>
        </div>

    </form>

    </section>


    </main>

    <script src="js/script.js"></script>

</body>

</html>
